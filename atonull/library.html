<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Stories — Drift</title>
  <meta name="description" content="Every story you've created is saved here. Replay a favorite or start a new one.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2C97D' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2C97D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      <span class="brand-name">Drift</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">New story</a>
      <a href="library.html" aria-current="page">My stories</a>
      <a href="#settings">Settings</a>
    </nav>
  </header>

  <main class="page page--library">
    <section class="library-head">
      <div>
        <h1>My stories</h1>
        <p>Every story you've created is saved here. Replay a favorite or start a new one.</p>
      </div>
      <a class="link-btn" href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        New story
      </a>
    </section>

    <div class="toolbar">
      <div class="chip-row" id="filters" role="group" aria-label="Filter stories"></div>
      <div class="search">
        <label class="field-label" for="search">Search</label>
        <input id="search" type="search" placeholder="Title, setting or character">
      </div>
    </div>

    <div class="story-grid" id="story-grid"></div>

    <div class="empty-panel" id="empty" hidden>
      <h2>No stories here yet</h2>
      <p id="empty-text">Tap the star on a story to add it to your favorites.</p>
    </div>
  </main>

  <script src="library.js"></script>
</body>
</html>
